name: Rust

permissions:
  contents: read
  checks: write

on:
  push:
    branches: [ main, evmrs ]
    paths:
      - '.github/workflows/rust.yaml'
      - 'rust/**'
      - Makefile
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/rust.yaml'
      - 'rust/**'
      - Makefile

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@1.97
      with:
        components: rustfmt
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: cargo fmt
      working-directory: rust
      run: cargo fmt --check

  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@1.97
      with:
        components: clippy
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: install cargo-hack
      run: cargo install cargo-hack
    - name: cargo clippy
      working-directory: rust
      run: cargo hack --workspace --each-feature --exclude-features needs-cache,tail-call,simd,performance-nightly clippy --all-targets -- --deny warnings

  doc:
    name: doc
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@1.97
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: install cargo-hack
      run: cargo install cargo-hack
    - name: cargo doc
      env:
        RUSTDOCFLAGS: "-D warnings"
      working-directory: rust
      run: cargo hack --workspace --each-feature --exclude-features needs-cache,tail-call,simd,performance-nightly doc --no-deps

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@1.97
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: install cargo-hack
      run: cargo install cargo-hack
    - name: cargo build
      working-directory: rust
      run: cargo hack --workspace --each-feature --exclude-features needs-cache,tail-call,simd,performance-nightly build

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@1.97
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: install cargo-hack
      run: cargo install cargo-hack
    - name: cargo test
      working-directory: rust
      run: cargo hack --workspace --each-feature --exclude-features needs-cache,tail-call,simd,performance-nightly test

  nightly-features:
    name: nightly-features
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-08-05
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: cargo test
      working-directory: rust
      run: |
        cargo +nightly-2026-08-05 test --profile release --features tail-call
        cargo +nightly-2026-08-05 test --profile release --features tail-call,fn-ptr-conversion-dispatch
        cargo +nightly-2026-08-05 test --profile release --features simd
        cargo +nightly-2026-08-05 test --profile release --features performance-nightly

  test-with-sanitizers:
    name: test-with-sanitizers
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-08-05
        components: rust-src
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: install cargo-hack
      run: cargo install cargo-hack
    - name: cargo test with address sanitizer
      working-directory: rust
      env:
        RUSTFLAGS: -Zsanitizer=address
      run: cargo +nightly-2026-08-05 hack --workspace --each-feature --exclude-features needs-cache test -Zbuild-std --target x86_64-unknown-linux-gnu
    - name: cargo test with memory sanitizer
      working-directory: rust
      env:
        RUSTFLAGS: "-Zsanitizer=memory -Zsanitizer-memory-track-origins"
        RUSTDOCFLAGS: "-Zsanitizer=memory -Zsanitizer-memory-track-origins -Cunsafe-allow-abi-mismatch=sanitizer"
      run: cargo +nightly-2026-08-05 hack --workspace --each-feature --exclude-features needs-cache test -Zbuild-std --target x86_64-unknown-linux-gnu
    - name: cargo test with thread sanitizer
      working-directory: rust
      env:
        # MI_TSAN makes mimalloc store its page flags in separate bytes instead of bits of a shared
        # byte, which otherwise causes the thread sanitizer to report benign races.
        CFLAGS: "-fsanitize=thread -DMI_TSAN=1"
        RUSTFLAGS: -Zsanitizer=thread
        RUSTDOCFLAGS: "-Zsanitizer=thread -Cunsafe-allow-abi-mismatch=sanitizer"
      run: cargo +nightly-2026-08-05 hack --workspace --each-feature --exclude-features needs-cache test -Zbuild-std --target x86_64-unknown-linux-gnu

  benchmarks-with-sanitizers:
    name: benchmarks-with-sanitizers
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-08-05
        components: rust-src
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: install cargo-hack
      run: cargo install cargo-hack
    - name: cargo run benchmarks with address sanitizer
      working-directory: rust
      env:
        RUSTFLAGS: -Zsanitizer=address
      run: cargo +nightly-2026-08-05 hack --each-feature run -Zbuild-std --target x86_64-unknown-linux-gnu --package benchmarks --release -- 1 all-short
    - name: cargo run benchmarks with memory sanitizer
      working-directory: rust
      env:
        RUSTFLAGS: "-Zsanitizer=memory -Zsanitizer-memory-track-origins"
      run: cargo +nightly-2026-08-05 hack --each-feature run -Zbuild-std --target x86_64-unknown-linux-gnu --package benchmarks --release -- 1 all-short
    - name: cargo run benchmarks with thread sanitizer
      working-directory: rust
      env:
        # MI_TSAN makes mimalloc store its page flags in separate bytes instead of bits of a shared
        # byte, which otherwise causes the thread sanitizer to report benign races.
        CFLAGS: "-fsanitize=thread -DMI_TSAN=1"
        RUSTFLAGS: -Zsanitizer=thread
      run: cargo +nightly-2026-08-05 hack --each-feature run -Zbuild-std --target x86_64-unknown-linux-gnu --package benchmarks --release -- 1 all-short

  miri:
    name: miri
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-08-05
        components: miri
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: install cargo-hack
      run: cargo install cargo-hack
    - name: cargo miri test
      working-directory: rust
      env:
        MIRIFLAGS: "-Zmiri-disable-stacked-borrows -Zmiri-permissive-provenance -Zmiri-backtrace=full"
      run: cargo +nightly-2026-08-05 hack miri test --workspace --each-feature --exclude-features needs-cache,mimalloc,performance,performance-nightly
    - name: cargo miri benchmarks
      working-directory: rust
      env:
        MIRIFLAGS: "-Zmiri-disable-stacked-borrows -Zmiri-permissive-provenance -Zmiri-backtrace=full"
      run: cargo +nightly-2026-08-05 hack miri run --package benchmarks --each-feature --exclude-features mimalloc,performance,performance-nightly -- 1 all-short

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: install rust
      uses: dtolnay/rust-toolchain@1.97
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: install cargo-fuzz
      run: cargo install cargo-fuzz
    - name: cargo fuzz evmc execute
      working-directory: rust
      run: cargo fuzz run --release --sanitizer none evmc_execute -- -max_total_time=10  -- -rss_limit_mb=6000

  deps:
    name: unused deps
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: load cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rust
    - name: install cargo-machete
      run: cargo install cargo-machete
    - name: cargo machete
      working-directory: rust
      run: cargo machete
