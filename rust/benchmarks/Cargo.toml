[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"

[features]
performance = ["evmrs/performance"]
performance-nightly = ["evmrs/performance-nightly"]
mimalloc = ["evmrs/mimalloc"]
hash-cache = ["evmrs/hash-cache"]
code-analysis-cache = ["evmrs/code-analysis-cache"]
alloc-reuse = ["evmrs/alloc-reuse"]
unsafe-hints = ["evmrs/unsafe-hints"]
fn-ptr-conversion-dispatch = ["evmrs/fn-ptr-conversion-dispatch"]
tail-call = ["evmrs/tail-call"]
simd = ["evmrs/simd"]

[dependencies]
evmrs = { path = ".." }
driver = { path = "../driver" }
sha3 = "0.12.0"
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "interpreter"
harness = false
