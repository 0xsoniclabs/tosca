[workspace]
members = [
    "driver",
    "benchmarks",
    "bencher",
    "llvm-profile-wrappers",
    "fuzz",
    "evmc-vm",
]

[package]
name = "evmrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[profile.release]
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[features]
default = []

# all optimizations that compile on stable rust
performance = [
    "mimalloc",
    "hash-cache",
    "code-analysis-cache",
    "alloc-reuse",
    "unsafe-hints",
    "fn-ptr-conversion-dispatch",
]
# every optimization, including ones that require nightly rust
performance-nightly = ["performance", "tail-call", "simd"]

# individual optimizations
mimalloc = ["dep:mimalloc"]
hash-cache = ["dep:lru"]
code-analysis-cache = ["dep:nohash-hasher", "dep:lru"]
alloc-reuse = []
unsafe-hints = []
fn-ptr-conversion-dispatch = []
# nightly only optimizations
tail-call = []
simd = []

# code only used by other crates: mocks outside of `cfg(test)` and `Arbitrary` impls for the fuzz targets
mock = ["dep:mockall"]
fuzzing = ["dep:arbitrary"]

[dependencies]
evmc-vm = { path = "evmc-vm" }
llvm-profile-wrappers = { path = "llvm-profile-wrappers" }
bnum = "0.14.4"
ethnum = "1.5.0"
sha3 = "0.12.0"
mockall = { version = "0.15.0", optional = true }
arbitrary = { version = "1.4.2", features = ["derive"], optional = true }
# performance difference to v3 needs to be evaluated
mimalloc = { version = "0.1.52", features = ["v2"], optional = true }
lru = { version = "0.18.2", optional = true }
nohash-hasher = { version = "0.2.0", optional = true }

[dev-dependencies]
# workaround for enabling mock feature also in integration tests
evmrs = { path = ".", features = ["mock"] }
driver = { path = "driver", features = ["mock"] }
rstest = { version = "0.27.0", default-features = false }

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
macro_use_extern_crate = "warn"
unused_crate_dependencies = "warn"
unused_unsafe = "warn"

[lints.clippy]
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
copy_iterator = "warn"
default_trait_access = "warn"
filter_map_next = "warn"
format_push_string = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
items_after_statements = "warn"
large_types_passed_by_value = "warn"
macro_use_imports = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
multiple_inherent_impl = "warn"
multiple_unsafe_ops_per_block = "warn"
needless_collect = "warn"
needless_for_each = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
ref_patterns = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
trivially_copy_pass_by_ref = "warn"
undocumented_unsafe_blocks = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
